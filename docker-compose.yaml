name: learn-pytest-game-api

services:
  mockapi:
    build: .
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15

  test:
    build: .
    volumes:
      - .:/app  # mount the source, so code changes apply without a rebuild
    environment:
      API_BASE_URL: http://mockapi:5000
    depends_on:
      mockapi:
        condition: service_healthy  # wait until /health responds
    stdin_open: true
    tty: true
    command: sh
