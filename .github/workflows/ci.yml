# Run this workflow locally with act (https://github.com/nektos/act):
#   brew install act
#   act -W .github/workflows/ci.yml

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Lint
        run: |
          docker compose run --rm -T --no-deps test ruff check .
          docker compose run --rm -T --no-deps test ruff format --check .

      - name: Run tests
        run: >
          docker compose run --rm -T test
          pytest --cov --cov-report=term-missing
          --html=artifacts/report.html --self-contained-html

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: artifacts/report.html

      - name: Stop containers
        if: always()
        run: docker compose down
