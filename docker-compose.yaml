#version: '3.1'
services:
  mockapi:
    working_dir: /pytest_mount
    build:
      context: .
      dockerfile: Dockerfile
    command: python mockapi.py
    ports:
      - "5000:5000"

  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/pytest_mount
    stdin_open: true
    depends_on:
      - mockapi
    tty: true
    command: sh