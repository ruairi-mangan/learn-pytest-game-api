[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-docker-mock-app"
version = "2.0.0"
description = "Learning project: testing a mock video game API with pytest inside Docker."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ruairi Mangan" }]
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "requests>=2.32"]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "pytest-mock>=3.14",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --durations=5"
asyncio_default_fixture_loop_scope = "function"
log_cli_level = "INFO"
markers = [
    "integration: calls the running mockapi container over HTTP (needs API_BASE_URL)",
]

[tool.coverage.run]
source = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT"]
# Allow the "a, b" string form for parametrize names, as shown in the pytest docs.
ignore = ["PT006"]
